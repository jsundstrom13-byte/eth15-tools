name: Collect Kalshi 15m history
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 fetch-kalshi-history.py
      - name: Commit data
        run: |
          git config user.name "history-bot"
          git config user.email "history-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Kalshi 15m history $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
